name: ci
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
jobs:
  web-e2e:
    # Playwright smoke of apps/web against the mock API (task 052) —
    # informational: never blocks the merge gate.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qupon/web exec playwright install
          --with-deps chromium
      - run: pnpm --filter @qupon/web e2e
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: system packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pkg-config libssl-dev libudev-dev
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-go@v5
        with: {go-version-file: services/registrar/go.mod, cache-dependency-path: services/registrar/go.sum}
      - uses: actions/cache@v4
        with:
          # Not target/ or ~/.rustup: multi-GB, the post-job save of them killed the run after a green verify.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Agave 4.3.0
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.3.0/install)"
          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"
          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
      - name: Anchor 1.2.0 (avm)
        run: |
          cargo install --git https://github.com/otter-sec/anchor avm --force
          avm install 1.2.0 && avm use 1.2.0
      - name: golangci-lint
        run: |
          LINT=github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          go install "$LINT"
      - name: program keypair (CI builds only; deploy keypair is never in git)
        run: |
          mkdir -p target/deploy
          solana-keygen new --no-bip39-passphrase -s \
            -o target/deploy/qupon_bonds-keypair.json --force
      - run: make verify
      - name: codama drift check (generated client must match the IDL)
        run: |
          make client
          git diff --exit-code -- clients/ts/src/generated \
            clients/ts/package.json
          test -z "$(git status --porcelain -- clients/ts/src/generated)" || { git status --porcelain -- clients/ts/src/generated; exit 1; }
