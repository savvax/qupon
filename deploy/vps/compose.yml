# Qupon on one VPS: registrar API + console + Caddy (automatic HTTPS). Started by ops/deploy-vps.sh.
# Secrets live only on the server in /opt/qupon/*.env (written by the deploy script, mode 600).
services:
  registrar:
    build: { context: ../.., dockerfile: services/registrar/Dockerfile }
    env_file: /opt/qupon/registrar.env # RPC_URL, DEMO_LOGIN, QUPON_USERS, QUPON_*_KEYPAIR_JSON: registrar, issuer, paying agent, KYC provider, demo investor (devnet)
    environment:
      PROGRAM_ID: QPN1zdVm6PgMdJo4YxemtDxxbUczqaAk9sDsJQsJ2qd
      QUPON_CONFIG: /app/config/devnet.json
    volumes:
      - registrar_data:/data # executor config regenerated here at startup (no bind mount)
    restart: unless-stopped
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_API_URL: "https://api.${QUPON_HOST}" }
    env_file: /opt/qupon/web.env # server-side only; empty for now
    environment:
      API_INTERNAL_URL: http://registrar:8080 # session proxy talks to the API inside the compose network
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment: { QUPON_HOST: "${QUPON_HOST}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [registrar, web]
    restart: unless-stopped
volumes:
  registrar_data:
  caddy_data:
  caddy_config:
