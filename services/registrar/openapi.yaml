            - ACT_365
        issueDate:
          type: string
          description: YYYY-MM-DD
        maturityDate:
          type: string
          description: YYYY-MM-DD, after the issue date
        cash:
          type: string
          enum:
            - tkzt
            - usdc
          description: cash leg mint alias
    SeriesCreateResponse:
