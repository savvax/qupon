        "502":
          description: chain_unavailable
  /kase/bonds/{ticker}:
    get:
      summary: Cached kase.kz bond profile (SIMULATED upstream data source;
        never blocks a page)
      operationId: kaseBond
      parameters:
        - name: ticker
          in: path
          required: true
          description: 2-12 alphanumeric characters
          schema:
            type: string
      responses:
        "200":
          description: bond profile with schedule (may be marked stale after a
            successful load)
