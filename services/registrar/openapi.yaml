            - "null"
          description: owning organisation (issuer writes are scoped to it)
        updatedAt:
          type: integer
    KaseCheck:
      description: Schedule check — status ok carries the comparison, the others
        say why there is nothing to compare.
      type: object
      required:
        - status
        - actionPda
        - match
        - stale
      properties:
        status:
          type: string
          enum:
            - ok
            - no_ticker
            - no_period
            - no_schedule
        actionPda:
          type: string
        ticker:
          type: string
        recordDate:
          type: string
          format: date
        kaseFixation:
          type: string
          format: date
        period:
          type:
            - object
            - "null"
          properties:
            start:
              type: string
              format: date
            end:
              type: string
              format: date
        kasePeriod:
          type:
            - object
            - "null"
          description: the matched kase.kz schedule row
        match:
          type: boolean
        stale:
          type: boolean
        fetchedAt:
          type: string
          format: date-time
    ReportEnvelope:
      description: Report body shared by the statement/payout reports (JSON
        variant).
      type: object
      required:
        - payouts
        - totals
      properties:
        payouts:
          type: array
          items:
            type: object
            properties:
              series:
                type: string
              isin:
                type: string
              kind:
                type: string
              corpId:
                type: string
              action:
                type: string
              owner:
                type: string
              recordDate:
                type: string
                format: date
              paymentDate:
                type: string
                format: date
              units:
                type: integer
              gross:
                type: integer
              tax:
                type: integer
              net:
                type: integer
              principal:
                type: integer
              status:
                type: string
              currency:
                type: string
              decimals:
                type: integer
              paidAt:
                type: string
                format: date-time
              paidYear:
                type:
                  - integer
                  - "null"
        totals:
          type: object
          properties:
            gross:
              type: integer
            tax:
              type: integer
            net:
              type: integer
            principal:
              type: integer
            count:
              type: integer
        network:
          type: string
        generatedAt:
          type: string
          format: date-time
        sources:
          type: array
          description: the wallet addresses (or chain keys) the data came from
          items:
            type: string
    SystemHealth:
      description: Admin system health view (read-only, nothing audited).
      type: object
      required:
        - network
        - rpc
        - operators
        - executor
        - scheduler
        - ingest
        - kase
        - demo
      properties:
        network:
          type: string
        rpc:
          type: object
          required:
            - ok
            - latencyMs
            - slot
          properties:
            ok:
              type: boolean
            latencyMs:
              type: integer
            slot:
              type: integer
        operators:
          type: array
          items:
            type: object
            required:
              - name
              - address
              - sol
              - low
            properties:
              name:
                type: string
              address:
                type: string
              sol:
                type: number
              low:
                type: boolean
                description: below the 0.5 SOL threshold
        executor:
          type: object
          properties:
            running:
              type: integer
            queued:
              type: integer
            maxConcurrent:
              type: integer
        scheduler:
          type: object
          properties:
            enabled:
              type: boolean
            lastTick:
              type: string
              format: date-time
        ingest:
          type: object
          properties:
            lastSlot:
              type: integer
            lagSlots:
              type: integer
        kase:
          type: object
          properties:
            entries:
              type: integer
            lastFetch:
              type: string
              format: date-time
            lastError:
              type: string
        demo:
          type: object
          description: demo throttle usage (writes today, series today)
