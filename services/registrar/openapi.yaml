openapi: 3.1.0
info:
  title: Qupon registrar API
  version: 0.2.0
  license:
    name: MIT
  description: |
    Off-chain registrar service for the qupon_bonds corporate-actions engine.
    Contract for the Go handlers (`internal/api`) and the web client
    (`apps/web`).
    All timestamps are ISO 8601 with the Asia/Almaty offset (+05:00).
    All amounts are `{minor, display, currency}`; minor is a decimal string of
    minor units (tiyn for tKZT, 1e-6 for USDC).
servers:
  - url: http://localhost:8080
    description: local registrar
security: []
paths:
  /healthz:
    get:
      summary: Liveness + database check
      operationId: healthz
      responses:
        "200":
          description: service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /openapi.yaml:
    get:
      summary: This document
      operationId: getOpenapi
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml:
              schema: { type: string }
  /series:
    get:
      summary: List series
      operationId: listSeries
      responses:
        "200":
          description: series list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeriesDTO"
  /series/{mint}:
    get:
      summary: Series terms
      operationId: getSeries
      parameters:
        - $ref: "#/components/parameters/Mint"
      responses:
        "200":
          description: series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDTO"
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /series/{mint}/investors:
    get:
      summary: Holders of a series
      operationId: listInvestors
      parameters:
        - $ref: "#/components/parameters/Mint"
      responses:
        "200":
          description: investors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvestorDTO"
  /series/{mint}/schedule:
    get:
      summary: Coupon schedule (computed from issue_date, frequency, day_count)
      operationId: getSchedule
      parameters:
        - $ref: "#/components/parameters/Mint"
      responses:
        "200":
          description: schedule items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleItem"
  /series/{mint}/actions:
    get:
      summary: Corporate actions of a series
      operationId: listActions
      parameters:
        - $ref: "#/components/parameters/Mint"
      responses:
        "200":
          description: actions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActionDTO"
  /actions/{pda}:
    get:
      summary: Action detail
      operationId: getAction
      parameters:
        - $ref: "#/components/parameters/Pda"
      responses:
        "200":
          description: action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionDTO"
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /actions/{pda}/entitlements:
    get:
      summary: Entitlements of an action
      operationId: listEntitlements
      parameters:
        - $ref: "#/components/parameters/Pda"
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: >-
            entitlements sorted by owner pubkey ascending (snapshot order)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntitlementDTO"
  /actions/{pda}/reconcile:
    get:
      summary: Reconciliation report (chain totals vs recomputed math)
      operationId: reconcileAction
      parameters:
        - $ref: "#/components/parameters/Pda"
      responses:
        "200":
          description: report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileReport"
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /actions/{pda}/advance:
    post:
      summary: >-
        Run the next action step through the executor (qupon CLI). Same
        handler as /registrar/actions/{pda}/advance.
      operationId: advanceAction
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Pda"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceRequest"
      responses:
        "200":
          description: step result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvanceResponse"
        "400":
          description: no runnable step or validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: no valid back-office session (bearer token)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: the session's role is not registrar or admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /actions/{pda}/iso/seev031.xml:
    get:
      summary: ISO 20022 seev.031 agent notification (announcement)
      operationId: getSeev031
      parameters:
        - $ref: "#/components/parameters/Pda"
      responses:
        "200":
          description: XML document
          content:
            application/xml:
              schema: { type: string }
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /entitlements/{pda}/iso/seev036.xml:
    get:
      summary: ISO 20022 seev.036 instruction (per entitlement)
      operationId: getSeev036
      parameters:
        - $ref: "#/components/parameters/Pda"
      responses:
        "200":
          description: XML document
          content:
            application/xml:
              schema: { type: string }
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /actions/{pda}/iso/seev036.zip:
    get:
      summary: ISO 20022 seev.036 confirmations, ZIP for all holders
      operationId: getSeev036Zip
      parameters:
        - $ref: "#/components/parameters/Pda"
      responses:
        "200":
          description: ZIP archive, one seev.036 XML per holder
          content:
            application/zip:
              schema: { type: string, format: binary }
        "404":
          description: not found or no entitlements snapshotted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /actions/{pda}/notice:
    get:
      summary: KASE-style notice text
      operationId: getNotice
      parameters:
        - $ref: "#/components/parameters/Pda"
        - name: lang
          in: query
          schema: { type: string, enum: [en, ru], default: en }
      responses:
        "200":
          description: plain-text notice
          content:
            text/plain:
              schema: { type: string }
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /activity:
    get:
      summary: Live activity feed (on-chain program events, ingested by polling)
      operationId: listActivity
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        "200":
          description: events in chain order, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActivityItem"
  /schedule:
    get:
      summary: Planned coupon actions for every series (autopilot plan view)
      operationId: listSchedule
      responses:
        "200":
          description: per-series coupon calendar with matched on-chain actions
          content:
            application/json:
              schema:
                type: object
                required: [series]
                properties:
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        mint: { type: string }
                        ticker: { type: string }
                        status: { type: string }
                        nextCouponDate: { type: string }
                        items:
                          type: array
                          items:
                            $ref: "#/components/schemas/ScheduleItem"
  /approvals:
    get:
      summary: Scheduler proposals awaiting a human decision (approval gate)
      operationId: listApprovals
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, executed, all]
            default: pending
      responses:
        "200":
          description: approval rows (pending by default)
          content:
            application/json:
              schema:
                type: object
                required: [approvals]
                properties:
                  approvals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Approval"
  /approvals/{id}/approve:
    post:
      summary: >-
        Approve a pending scheduler proposal (executes the stored argv). Also
        served at /registrar/approvals/{id}/approve.
      operationId: approveApproval
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: executed; body carries the tx signature and explorer URL
        "401": { description: no valid back-office session }
        "403": { description: role is not registrar or admin }
        "409":
          description: >-
            already executed, or the chain refused the step (stays pending)
        "404": { description: no such approval }
  /auth/login:
    post:
      summary: Sign in to the back office with email and password
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: session token (the web keeps it in an httpOnly cookie)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400": { description: missing email or password }
        "401": { description: "bad_credentials" }
        "429": { description: "rate_limited (5 attempts per email per minute)" }
  /auth/demo:
    post:
      summary: One-click demo sign-in (only when DEMO_LOGIN=1)
      operationId: authDemo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [issuer, registrar, investor] }
      responses:
        "200":
          description: session for the demo user of that role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400": { description: unknown role }
        "403": { description: "demo_disabled" }
  /auth/logout:
    post:
      summary: End the session
      operationId: authLogout
      security: [{ bearerAuth: [] }]
      responses:
        "204": {description: signed out (also when the token was unknown)}
  /issuer/series:
    post:
      summary: >-
        Create a bond series: validate the terms, reserve the name, then run
        `qupon series:create` (Token-2022 bond mint + init_series) through the
        executor. Rolls the registry row back and returns 409 on a CLI failure.
      operationId: createSeries
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeriesCreateRequest"
      responses:
        "201":
          description: series created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesCreateResponse"
        "400": {description: "invalid_params — rejected before any CLI run"}
        "401": {description: no valid back-office session (bearer token)}
        "403": {description: the session's role is not issuer or admin}
        "409":
          description: >-
            series_exists (name taken) or onchain (CLI failure,
            onchainError carries the CLI message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503": {description: executor or base config not configured}
  /me:
    get:
      summary: The signed-in back-office user
      operationId: me
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: current user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401": { description: no valid session }
  /registrar/investors:
    post:
      summary: >-
        Onboard an investor: the KYC provider (SIMULATED) attests the wallet
        on the Solana Attestation Service, then the registrar registers the
        investor on-chain
      operationId: registrarOnboard
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [series, owner, investorType, residency, taxBps]
              properties:
                series: { type: string, description: bond mint (base58) }
                owner: { type: string, description: investor wallet (base58) }
                investorType: { type: string, enum: [individual, legal_entity] }
                residency: { type: string, enum: [resident, nonresident] }
                taxBps: { type: integer, minimum: 0, maximum: 10000 }
                expiryDays:
                  type: integer
                  minimum: 0
                  description: KYC validity in days (default 365, 0 = no expiry)
      responses:
        "201":
          description: attested and registered
          content:
            application/json:
              schema:
                type: object
                required: [investor, attestation, signatures]
                properties:
                  investor: { type: string, description: Investor PDA }
                  attestation:
                    { type: string, description: SAS attestation PDA }
                  signatures:
                    type: array
                    items: { type: string }
        "400":
          description: >-
            malformed input (non-base58 owner/mint, taxBps > 10000, unknown
            investorType or residency)
        "401": { description: no valid back-office session }
        "403": { description: role is not registrar or admin }
        "404":
          { description: "unknown_series — mint is not a registered series" }
        "409":
          description: the chain refused a step (onchainError carries the raw
            message)
        "503": { description: executor not configured }
  /registrar/investors/{mint}/{owner}/suspend:
    post:
      summary: Suspend an investor (freezes the bond ATA)
      operationId: registrarSuspend
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Mint"
        - name: owner
          in: path
          required: true
          description: investor wallet (base58)
          schema: { type: string }
      responses:
        "200":
          { description: executed; body carries the transaction signatures }
        "400": { description: mint or owner is not base58 }
        "401": { description: no valid back-office session }
        "403": { description: role is not registrar or admin }
        "404": { description: unknown_series }
        "409": { description: the chain refused the step (onchainError) }
  /registrar/investors/{mint}/{owner}/reinstate:
    post:
      summary: Reinstate a suspended investor
      operationId: registrarReinstate
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Mint"
        - name: owner
          in: path
          required: true
          description: investor wallet (base58)
          schema: { type: string }
      responses:
        "200":
          { description: executed; body carries the transaction signatures }
        "400": { description: mint or owner is not base58 }
        "401": { description: no valid back-office session }
        "403": { description: role is not registrar or admin }
        "404": { description: unknown_series }
        "409": { description: the chain refused the step (onchainError) }
  /registrar/audit:
    get:
      summary: The back-office audit feed (who ran which write, and what it did)
      operationId: registrarAudit
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: audit rows, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
        "400": { description: limit out of range }
        "401": { description: no valid back-office session }
        "403": { description: role is not registrar or admin }
  /demo/investor/subscribe:
    post:
      summary: >-
        Subscribe at par with the demo investor's custodial keypair (judges
        without a wallet); labelled demo custodial wallet in the UI.
      operationId: demoSubscribe
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoSubscribeRequest"
      responses:
        "200":
          description: subscribed; tx signature and explorer URL in the body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoResponse"
        "400": { description: units < 1 or not a base58 mint }
        "401": { description: no valid session }
        "403": { description: role is not investor_demo or admin }
        "404": { description: unknown_series }
        "409": { description: the chain refused the subscribe (onchainError) }
  /demo/investor/vote:
    post:
      summary: Cast a snapshot-weighted vote with the demo investor's keypair
      operationId: demoVote
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoVoteRequest"
      responses:
        "200":
          description: vote cast; body carries the tx signature and explorer URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoResponse"
        "400": { description: unknown choice or not a base58 action }
        "401": { description: no valid session }
        "403": { description: role is not investor_demo or admin }
        "404": { description: no corporate action at the PDA }
        "409": { description: the chain refused the vote (onchainError) }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: back-office session token from /auth/login or /auth/demo
  parameters:
    Mint:
      name: mint
      in: path
      required: true
      description: Bond mint pubkey (base58)
      schema: { type: string }
    Pda:
      name: pda
      in: path
      required: true
      description: >-
        Account pubkey (base58) — CorporateAction or Entitlement PDA
      schema: { type: string }
  schemas:
    User:
      type: object
      required: [id, email, name, role, isDemo]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [issuer, registrar, investor_demo, admin] }
        isDemo: { type: boolean }
    Session:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/User"
    AuditEntry:
      type: object
      required: [id, ts, userId, role, route, params, ok, detail, signatures]
      properties:
        id: { type: integer }
        ts: { type: integer, description: unix seconds }
        userId: { type: integer }
        role: { type: string }
        route: { type: string, example: "POST /registrar/investors" }
        params: { type: object, description: request params JSON }
        ok: { type: boolean }
        detail: { type: string }
        signatures:
          type: array
          items: { type: string }
    DemoSubscribeRequest:
      type: object
      required: [series, units]
      properties:
        series:
          type: string
          description: bond mint (base58)
        units: { type: integer, minimum: 1 }
    DemoVoteRequest:
      type: object
      required: [action, choice]
      properties:
        action:
          type: string
          description: CorporateAction PDA (base58)
        choice: { type: string, enum: [for, against, abstain] }
    DemoResponse:
      description: Demo custodial-wallet action result (always demo:true).
      type: object
      required: [demo, ok, signature]
      properties:
        demo: { type: boolean }
        ok: { type: boolean }
        signature: { type: string }
        explorerUrl: { type: string }
    Amount:
      description: Money amount in minor units plus a human display string.
      type: object
      required: [minor, display, currency]
      properties:
        minor:
          type: string
          description: Integer amount in minor units, decimal string
          example: "1250"
        display:
          type: string
          example: "12.50 KZT"
        currency:
          type: string
          example: tKZT
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            machine-readable code (http_404, executor_failed, or the Anchor
            program error name)
          example: EntitlementCalcMismatch
        message:
          type: string
          example: accrual days do not match crate day count
        onchainError:
          description: raw Anchor/program error when the failure came from-chain
          type: string
    Health:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        db: { type: string, example: ok }
    SeriesDTO:
      type: object
      required:
        [
          mint,
          cashMint,
          isin,
          ticker,
          faceValue,
          couponRateBps,
          frequency,
          dayCount,
          issueDate,
          maturityDate,
          nextCouponDate,
          status,
          totalIssued,
          quorumBps,
          approvalBps,
          explorerUrl,
        ]
      properties:
        mint: { type: string }
        cashMint: { type: string }
        registrar: { type: string }
        issuer: { type: string }
        payingAgent: { type: string }
        isin: { type: string, example: KZ1234567890 }
        ticker: { type: string, example: tKZBOND }
        faceValue:
          $ref: "#/components/schemas/Amount"
        couponRateBps: { type: integer, example: 1000 }
        frequency:
          type: integer
          description: coupons per year
          enum: [1, 2, 4, 12]
        dayCount:
          type: string
          enum: [THIRTY_360, ACT_ACT, ACT_365]
        issueDate: { type: string, format: date, example: "2026-09-01" }
        maturityDate: { type: string, format: date, example: "2027-09-01" }
        nextCouponDate:
          type: string
          format: date-time
          description: ISO 8601 with +05:00
          example: "2026-12-01T00:00:00+05:00"
        status:
          type: string
          enum: [Active, Matured, Retiring, Closed]
        totalIssued:
          type: string
          description: units in circulation, decimal string
        quorumBps: { type: integer }
        approvalBps: { type: integer }
        openAction:
          type: [string, "null"]
        explorerUrl:
          type: string
          description: devnet explorer link for the mint
    InvestorDTO:
      type: object
      required: [owner, bondAta, cashAta, units, status]
      properties:
        owner: { type: string }
        bondAta: { type: string }
        cashAta: { type: string }
        units:
          type: string
          description: bond units held, decimal string
        status:
          type: string
          enum: [Active, Suspended]
        explorerUrl:
          type: string
          description: devnet explorer link for the owner
    ActionDTO:
      type: object
      required:
        [
          pda,
          seriesMint,
          kind,
          mandatory,
          corpId,
          recordAt,
          paymentAt,
          status,
          perUnitGross,
          perUnitPrincipal,
          cashMint,
          explorerUrl,
        ]
      properties:
        pda: { type: string }
        seriesMint: { type: string }
        kind:
          type: string
          enum: [INTR, REDM, MCAL, PCAL, BMET, CHAN]
          description: >-
            ISO 20022 corp action event type
            (INTE/REDM/MCAL/PCAL/METG/CHAN mapped)
        mandatory:
          type: string
          enum: [MAND, VOLU, CHOS]
        corpId: { type: string, example: QPNb1-INTR-0001 }
        officialId:
          type: [string, "null"]
          description: COAF id, may be empty
        announcedAt:
          type: string
          format: date-time
          description: ISO 8601 with +05:00
        recordAt:
          type: string
          format: date-time
        paymentAt:
          type: string
          format: date-time
        periodStart:
          type: [string, "null"]
          format: date
        periodEnd:
          type: [string, "null"]
          format: date
        accrualDays:
          type: [integer, "null"]
        rateBps:
          type: [integer, "null"]
        perUnitGross:
          $ref: "#/components/schemas/Amount"
        perUnitPrincipal:
          $ref: "#/components/schemas/Amount"
        cashMint: { type: string }
        escrow: { type: string }
        escrowBalance:
          $ref: "#/components/schemas/Amount"
          description: live escrow token balance (0 before funding)
        status:
          type: string
          enum:
            [
              Announced,
              RecordStruck,
              SnapshotComplete,
              Funded,
              Settling,
              Completed,
              Retiring,
              Cancelled,
              VotingOpen,
              Finalized,
            ]
        snapshotSlot:
          type: [integer, "null"]
        snapshotHash:
          type: [string, "null"]
          description: hex sha256
        unitsSnapshotted:
          type: [string, "null"]
        holdersSnapshotted:
          type: [integer, "null"]
        holdersPaid:
          type: [integer, "null"]
        totalGross:
          $ref: "#/components/schemas/Amount"
        totalTax:
          $ref: "#/components/schemas/Amount"
        totalNet:
          $ref: "#/components/schemas/Amount"
        totalPaid:
          $ref: "#/components/schemas/Amount"
        totalRetired:
          type: [string, "null"]
        holdersRetired:
          type: [integer, "null"]
        proposalNewRateBps:
          type: [integer, "null"]
        proposalNewMaturity:
          type: [string, "null"]
          format: date
        votingEndsAt:
          type: [string, "null"]
          format: date-time
        votesFor:
          type: [string, "null"]
        votesAgainst:
          type: [string, "null"]
        votesAbstain:
          type: [string, "null"]
        result:
          type: [string, "null"]
          enum: [Pending, Approved, Rejected, NoQuorum]
        completedAt:
          type: [string, "null"]
          format: date-time
        factorBps:
          type: [integer, "null"]
        explorerUrl:
          type: string
          description: devnet explorer link for the action PDA
    EntitlementDTO:
      type: object
      required: [pda, actionPda, owner, units, status]
      properties:
        pda: { type: string }
        actionPda: { type: string }
        owner: { type: string }
        units: { type: string }
        gross:
          $ref: "#/components/schemas/Amount"
        tax:
          $ref: "#/components/schemas/Amount"
        net:
          $ref: "#/components/schemas/Amount"
        principal:
          $ref: "#/components/schemas/Amount"
        status:
          type: string
          enum: [Snapshotted, Paid, Retired]
        paidAt:
          type: [string, "null"]
          format: date-time
        vote:
          type: string
          enum: [None, For, Against, Abstain]
        votedAt:
          type: [string, "null"]
          format: date-time
        explorerUrl:
          type: string
          description: devnet explorer link for the entitlement PDA
    ScheduleItem:
      description: One projected coupon (or redemption) on the series schedule.
      type: object
      required: [couponNumber, recordDate, paymentDate, status]
      properties:
        couponNumber: { type: integer, example: 2 }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        recordDate:
          type: string
          format: date-time
          description: ISO 8601 with +05:00
        paymentDate:
          type: string
          format: date-time
        amountPerUnit:
          $ref: "#/components/schemas/Amount"
        totalAmount:
          $ref: "#/components/schemas/Amount"
        actionPda:
          type: [string, "null"]
          description: set once announced
        status:
          type: string
          enum: [Projected, Announced, InProgress, Completed]
    Approval:
      description: One scheduler proposal awaiting a human decision (task 024).
      type: object
      required: [id, ts, dedupKey, seriesMint, step, args, status]
      properties:
        id: { type: integer }
        ts: { type: integer, description: unix seconds }
        dedupKey: { type: string }
        seriesMint: { type: string }
        actionPda:
          type: string
          description: empty for announce decisions
        step: { type: string, example: "step:strike_record" }
        args:
          type: array
          items: { type: string }
          description: the exact qupon CLI argv approve runs
        status: { type: string, enum: [pending, executed] }
        detail:
          type: [object, "null"]
          description: CLI result JSON once executed
    ReconcileReport:
      description: >-
        Registrar recomputation vs chain: entitlements recomputed from bond
        ATA balances (minContextSlot = snapshot_slot), snapshot hash chained
        sha256(prev ‖ owner ‖ units_le) over investors owner-ascending, and
        action totals (docs/03-domain.md §4).
      type: object
      required:
        - actionPda
        - ok
        - holders
        - mismatches
        - expectedHash
        - onchainHash
        - hashMatches
        - supply
        - unitsSnapshotted
        - totalsMatch
      properties:
        actionPda: { type: string }
        actionStatus: { type: string, example: Completed }
        ok: { type: boolean }
        holders:
          type: integer
          description: investors with a non-zero balance at read time
        mismatches:
          type: array
          items:
            type: object
            required: [owner, reason]
            properties:
              owner: { type: string }
              reason:
                type: string
                enum:
                  - missing_entitlement
                  - unexpected_entitlement
                  - entitlement_mismatch
                  - ata_mismatch
              fields:
                type: array
                items: { type: string }
                description: >-
                  differing fields among units/gross/tax/net/principal
              expected: { $ref: "#/components/schemas/ReconcileEntry" }
              onchain: { $ref: "#/components/schemas/ReconcileEntry" }
        expectedHash:
          type: string
          description: base58 sha256 chain recomputed owner-ascending
        onchainHash: { type: string }
        hashMatches: { type: boolean }
        supply: { type: integer, description: bond mint supply at read time }
        unitsSnapshotted: { type: integer }
        expectedTotals: { $ref: "#/components/schemas/ReconcileTotals" }
        onchainTotals: { $ref: "#/components/schemas/ReconcileTotals" }
        totalsMatch: { type: boolean }
        checkedAt: { type: integer, description: unix seconds }
    ReconcileEntry:
      type: object
      required: [units, gross, tax, net, principal]
      properties:
        units: { type: integer }
        gross: { type: integer }
        tax: { type: integer }
        net: { type: integer }
        principal: { type: integer }
    ReconcileTotals:
      type: object
      required: [units, holders, gross, tax, net, principal]
      properties:
        units: { type: integer }
        holders: { type: integer }
        gross: { type: integer }
        tax: { type: integer }
        net: { type: integer }
        principal: { type: integer }
    AdvanceRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: must be true; refuses without explicit confirmation
        autofund:
          type: boolean
          description: >-
            fund the escrow from the paying agent (demo mode) when the
            action waits for funding
          default: false
    AdvanceResponse:
      type: object
      required: [step, ok, status]
      properties:
        step:
          type: string
          description: >-
            executed step, e.g. strike_record, snapshot_batch, pay_batch
        ok: { type: boolean }
        signature:
          type: [string, "null"]
          description: tx signature
        slot:
          type: [integer, "null"]
          description: confirmation slot
        explorerUrl:
          type: [string, "null"]
          description: https://explorer.solana.com/tx/<sig>?cluster=devnet
        status:
          type: string
          description: action status re-read from the chain after the step
        nextStep:
          type: [string, "null"]
        preview:
          type: boolean
          description: true when the step was not executed (dry run)
        error:
          $ref: "#/components/schemas/Error"
    SeriesCreateRequest:
      type: object
      required:
        - name
        - isin
        - faceValue
        - couponRateBps
        - frequency
        - dayCount
        - issueDate
        - maturityDate
        - cash
      properties:
        name:
          type: string
          description: 1-16 characters of A-Z a-z 0-9 -
        isin:
          type: string
          description: 12 characters — 2 letters, 9 alphanumerics, 1 check digit
        faceValue:
          type: integer
          format: int64
          description: face value in minor units (> 0)
        couponRateBps:
          type: integer
          description: coupon rate in bps, 1..10000 (1000 = 10%)
        frequency:
          type: integer
          enum: [1, 2, 4, 12]
          description: coupons per year
        dayCount:
          type: string
          enum: [THIRTY_360, ACT_365]
        issueDate:
          type: string
          description: YYYY-MM-DD
        maturityDate:
          type: string
          description: YYYY-MM-DD, after the issue date
        cash:
          type: string
          enum: [tkzt, usdc]
          description: cash leg mint alias
    SeriesCreateResponse:
      type: object
      required: [series, mint, signatures]
      properties:
        series: {type: string}
        mint: {type: string}
        signatures:
          type: array
          items: {type: string}
          description: tx signatures (mint create, metadata, init_series)
    ActivityItem:
      type: object
      required: [id, ts, kind, sig, slot, seq]
      properties:
        id: { type: integer }
        ts:
          type: integer
          description: unix seconds
        seriesMint:
          type: [string, "null"]
        actionPda:
          type: [string, "null"]
        kind: { type: string, example: ActionAnnounced }
        payload: { type: object }
        sig: { type: string }
        slot: { type: integer }
        seq:
          type: integer
          description: ingest order within slot
        explorerUrl:
          type: string
          description: https://explorer.solana.com/tx/<sig>?cluster=devnet
