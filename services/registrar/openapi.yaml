openapi: 3.1.0
info:
  title: Qupon registrar API
  version: 0.2.0
  license:
    name: MIT
  description: |
    Off-chain registrar service for the qupon_bonds corporate-actions engine.
    Contract for the Go handlers (`internal/api`) and the web client
    (`apps/web`).
    All timestamps are ISO 8601 with the Asia/Almaty offset (+05:00).
    All amounts are `{minor, display, currency}`; minor is a decimal string of
    minor units (tiyn for tKZT, 1e-6 for USDC).
    Back-office writes by demo users (one-click demo sign-in, shared accounts)
    are capped per demo role — 60 per hour, and 10 series creations per day —
    and answer 429 with code `demo_throttled` past the cap. Sign-ins are
    limited to 20 per client IP per minute (429 `rate_limited`).
servers:
  - url: http://localhost:8080
    description: local registrar
security: []
paths:
  /healthz:
    get:
      summary: Liveness + database check
      operationId: healthz
      responses:
        "200":
          description: service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        "503":
          description: database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /openapi.yaml:
    get:
      summary: This document
      operationId: getOpenapi
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string
  /series:
    get:
      summary: List series
      operationId: listSeries
      responses:
        "200":
          description: series list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeriesDTO'
  /series/{mint}:
    get:
      summary: Series terms
      operationId: getSeries
      parameters:
        - $ref: '#/components/parameters/Mint'
      responses:
        "200":
          description: series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesDTO'
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /series/{mint}/investors:
    get:
      summary: Holders of a series
      operationId: listInvestors
      parameters:
        - $ref: '#/components/parameters/Mint'
      responses:
        "200":
          description: investors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvestorDTO'
  /series/{mint}/trades:
    get:
      summary: Admitted secondary trades of a series (settled by the Solana DvP program), oldest first, with the funding of both legs
      operationId: listTrades
      parameters:
        - $ref: '#/components/parameters/Mint'
      responses:
        "200":
          description: the count of admitted trades and the trades themselves
          content:
            application/json:
              schema:
                type: object
                required:
                  - openTrades
                  - items
                properties:
                  openTrades:
                    type: integer
                    description: admitted trades not yet released; strike_record is refused while this is above 0
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TradeDTO'
        "404":
          description: unknown_series
        "503":
          description: chain reader not configured
  /series/{mint}/schedule:
    get:
      summary: Coupon schedule (computed from issue_date, frequency, day_count)
      operationId: getSchedule
      parameters:
        - $ref: '#/components/parameters/Mint'
      responses:
        "200":
          description: schedule items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleItem'
  /series/{mint}/actions:
    get:
      summary: Corporate actions of a series
      operationId: listActions
      parameters:
        - $ref: '#/components/parameters/Mint'
      responses:
        "200":
          description: actions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActionDTO'
  /actions/{pda}:
    get:
      summary: Action detail
      operationId: getAction
      parameters:
        - $ref: '#/components/parameters/Pda'
      responses:
        "200":
          description: action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionDTO'
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /actions/{pda}/entitlements:
    get:
      summary: Entitlements of an action
      operationId: listEntitlements
      parameters:
        - $ref: '#/components/parameters/Pda'
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: entitlements sorted by owner pubkey ascending (snapshot
            order)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntitlementDTO'
  /actions/{pda}/reconcile:
    get:
      summary: Reconciliation report (chain totals vs recomputed math)
      operationId: reconcileAction
      parameters:
        - $ref: '#/components/parameters/Pda'
      responses:
        "200":
          description: report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileReport'
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /actions/{pda}/advance:
    post:
      summary: Run the next action step through the executor (qupon CLI). Same
        handler as /registrar/actions/{pda}/advance.
      operationId: advanceAction
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Pda'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceRequest'
      responses:
        "200":
          description: step result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvanceResponse'
        "400":
          description: no runnable step or validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: no valid back-office session (bearer token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: the session's role is not registrar or admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /actions/{pda}/iso/seev031.xml:
    get:
      summary: ISO 20022 seev.031 agent notification (announcement)
      operationId: getSeev031
      parameters:
        - $ref: '#/components/parameters/Pda'
      responses:
        "200":
          description: XML document
          content:
            application/xml:
              schema:
                type: string
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /entitlements/{pda}/iso/seev036.xml:
    get:
      summary: ISO 20022 seev.036 instruction (per entitlement)
      operationId: getSeev036
      parameters:
        - $ref: '#/components/parameters/Pda'
      responses:
        "200":
          description: XML document
          content:
            application/xml:
              schema:
                type: string
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /actions/{pda}/iso/seev036.zip:
    get:
      summary: ISO 20022 seev.036 confirmations, ZIP for all holders
      operationId: getSeev036Zip
      parameters:
        - $ref: '#/components/parameters/Pda'
      responses:
        "200":
          description: ZIP archive, one seev.036 XML per holder
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          description: not found or no entitlements snapshotted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /actions/{pda}/notice:
    get:
      summary: KASE-style notice text
      operationId: getNotice
      parameters:
        - $ref: '#/components/parameters/Pda'
        - name: lang
          in: query
          schema:
            type: string
            enum:
              - en
              - ru
              - kk
            default: en
      responses:
        "200":
          description: plain-text notice
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /activity:
    get:
      summary: Live activity feed (on-chain program events, ingested by polling)
      operationId: listActivity
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
      responses:
        "200":
          description: events in chain order, oldest first
          content:
            application/json:
              schema:
                type: object
                required:
                  - events
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityItem'
  /schedule:
    get:
      summary: Planned coupon actions for every series (autopilot plan view)
      operationId: listSchedule
      responses:
        "200":
          description: per-series coupon calendar with matched on-chain actions
          content:
            application/json:
              schema:
                type: object
                required:
                  - series
                properties:
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        mint:
                          type: string
                        ticker:
                          type: string
                        status:
                          type: string
                        nextCouponDate:
                          type: string
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/ScheduleItem'
  /approvals:
    get:
      summary: Scheduler proposals awaiting a human decision (approval gate)
      operationId: listApprovals
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - pending
              - running
              - executed
              - rejected
              - stale
              - all
            default: pending
      responses:
        "200":
          description: approval rows (pending by default)
          content:
            application/json:
              schema:
                type: object
                required:
                  - approvals
                properties:
                  approvals:
                    type: array
                    items:
                      $ref: '#/components/schemas/Approval'
  /approvals/{id}/approve:
    post:
      summary: Approve a pending scheduler proposal (executes the stored argv).
        Also served at /registrar/approvals/{id}/approve.
      operationId: approveApproval
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: executed; body carries the tx signature and explorer URL
        "401":
          description: no valid back-office session
        "403":
          description: role is not registrar or admin
        "409":
          description: not pending anymore (already claimed, executed or
            rejected), or the chain refused the step (stays pending)
        "404":
          description: no such approval
  /registrar/approvals/{id}/reject:
    post:
      summary: Reject a pending scheduler proposal (nothing executes; the row
        leaves the pending queue).
      operationId: rejectApproval
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: rejected; body is {id, status:"rejected"}
        "401":
          description: no valid back-office session
        "403":
          description: role is not registrar or admin
        "409":
          description: approval is not pending (already executed, rejected,
            claimed or stale)
        "404":
          description: no such approval
  /auth/login:
    post:
      summary: Sign in to the back office with email and password
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: session token (the web keeps it in an httpOnly cookie)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        "400":
          description: missing email or password
        "401":
          description: bad_credentials
        "429":
          description: rate_limited (5 attempts per email per minute)
  /auth/demo:
    post:
      summary: One-click demo sign-in (only when DEMO_LOGIN=1)
      operationId: authDemo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum:
                    - issuer
                    - registrar
                    - investor
      responses:
        "200":
          description: session for the demo user of that role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        "400":
          description: unknown role
        "403":
          description: demo_disabled
  /auth/logout:
    post:
      summary: End the session
      operationId: authLogout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: signed out (also when the token was unknown)
  /issuer/series:
    post:
      summary: 'Create a bond series: validate the terms, reserve the name, then
        run `qupon series:create` (Token-2022 bond mint + init_series) through
        the executor. Rolls the registry row back and returns 409 on a CLI
        failure.'
      operationId: createSeries
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesCreateRequest'
      responses:
        "201":
          description: series created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesCreateResponse'
        "400":
          description: invalid_params — rejected before any CLI run
        "401":
          description: no valid back-office session (bearer token)
        "403":
          description: the session's role is not issuer or admin
        "409":
          description: series_exists (name taken) or onchain (CLI failure,
            onchainError carries the CLI message)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: executor or base config not configured
  /issuer/series/{mint}/actions:
    post:
      summary: Announce a cash corporate action (INTR coupon, REDM at maturity,
        MCAL early call) on the series — runs `qupon action:announce` through
        the executor.
      operationId: issuerAnnounce
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Mint'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kind
                - recordAt
                - paymentAt
              properties:
                kind:
                  type: string
                  enum:
                    - INTR
                    - REDM
                    - MCAL
                recordAt:
                  type: integer
                  description: record date, unix seconds
                paymentAt:
                  type: integer
                  description: payment date, unix seconds
                callDate:
                  type: string
                  description: MCAL only — call date YYYY-MM-DD (required for
                    MCAL, rejected otherwise)
                corpId:
                  type: string
                  description: 'CORP id, at most 16 bytes (default:
                    <series>-<KIND>-####)'
      responses:
        "201":
          description: announced
          content:
            application/json:
              schema:
                type: object
                required:
                  - action
                  - signatures
                properties:
                  action:
                    type: string
                    description: CorporateAction PDA
                  signatures:
                    type: array
                    items:
                      type: string
        "400":
          description: invalid_params — kind, callDate, dates or corpId rejected
            before any CLI run
        "401":
          description: no valid back-office session
        "403":
          description: the session's role is not issuer or admin
        "404":
          description: unknown_series — mint is not a registered series
        "409":
          description: the chain refused the announcement (onchainError carries
            the CLI message)
        "503":
          description: executor not configured
  /issuer/series/{mint}/meetings:
    post:
      summary: Announce a bondholder meeting (BMET) proposing a new coupon rate
        — runs `qupon meeting:announce` through the executor.
      operationId: issuerMeeting
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Mint'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newRateBps
                - recordAt
                - votingEndsAt
              properties:
                newRateBps:
                  type: integer
                  minimum: 1
                  maximum: 10000
                recordAt:
                  type: integer
                  description: record date, unix seconds
                votingEndsAt:
                  type: integer
                  description: voting deadline, unix seconds
      responses:
        "201":
          description: meeting announced
          content:
            application/json:
              schema:
                type: object
                required:
                  - action
                  - signatures
                properties:
                  action:
                    type: string
                    description: CorporateAction PDA
                  signatures:
                    type: array
                    items:
                      type: string
        "400":
          description: invalid_params — rate out of range or voting ends before
            the record date
        "401":
          description: no valid back-office session
        "403":
          description: the session's role is not issuer or admin
        "404":
          description: unknown_series
        "409":
          description: the chain refused the announcement (onchainError)
        "503":
          description: executor not configured
  /issuer/actions/{pda}/fund:
    post:
      summary: 'Fund the action escrow — runs `qupon action:fund` (idempotent:
        fills only the shortfall, so a second call returns skipped true and
        moves no funds).'
      operationId: issuerFund
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Pda'
      responses:
        "200":
          description: funded (or skipped — the escrow was already full)
          content:
            application/json:
              schema:
                type: object
                required:
                  - signatures
                  - skipped
                properties:
                  signatures:
                    type: array
                    items:
                      type: string
                  skipped:
                    type: boolean
        "400":
          description: pda is not base58
        "401":
          description: no valid back-office session
        "403":
          description: the session's role is not issuer or admin
        "404":
          description: no corporate action at the pda, or unknown_series
        "409":
          description: the chain refused the funding (onchainError)
        "503":
          description: chain reader or executor not configured
  /me:
    get:
      summary: The signed-in back-office user
      operationId: me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: current user
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        "401":
          description: no valid session
  /registrar/investors:
    post:
      summary: 'Onboard an investor: the KYC provider (SIMULATED) attests the
        wallet on the Solana Attestation Service, then the registrar registers
        the investor on-chain'
      operationId: registrarOnboard
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - series
                - owner
                - investorType
                - residency
                - taxBps
              properties:
                series:
                  type: string
                  description: bond mint (base58)
                owner:
                  type: string
                  description: investor wallet (base58)
                investorType:
                  type: string
                  enum:
                    - individual
                    - legal_entity
                residency:
                  type: string
                  enum:
                    - resident
                    - nonresident
                taxBps:
                  type: integer
                  minimum: 0
                  maximum: 10000
                expiryDays:
                  type: integer
                  minimum: 0
                  description: KYC validity in days (default 365, 0 = no expiry)
      responses:
        "201":
          description: attested and registered
          content:
            application/json:
              schema:
                type: object
                required:
                  - investor
                  - attestation
                  - signatures
                properties:
                  investor:
                    type: string
                    description: Investor PDA
                  attestation:
                    type: string
                    description: SAS attestation PDA
                  signatures:
                    type: array
                    items:
                      type: string
        "400":
          description: malformed input (non-base58 owner/mint, taxBps > 10000,
            unknown investorType or residency)
        "401":
          description: no valid back-office session
        "403":
          description: role is not registrar or admin
        "404":
          description: unknown_series — mint is not a registered series
        "409":
          description: the chain refused a step (onchainError carries the raw
            message)
        "503":
          description: executor not configured
  /registrar/investors/{mint}/{owner}/suspend:
    post:
      summary: Suspend an investor (freezes the bond ATA)
      operationId: registrarSuspend
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Mint'
        - name: owner
          in: path
          required: true
          description: investor wallet (base58)
          schema:
            type: string
      responses:
        "200":
          description: executed; body carries the transaction signatures
        "400":
          description: mint or owner is not base58
        "401":
          description: no valid back-office session
        "403":
          description: role is not registrar or admin
        "404":
          description: unknown_series
        "409":
          description: the chain refused the step (onchainError)
  /registrar/investors/{mint}/{owner}/reinstate:
    post:
      summary: Reinstate a suspended investor
      operationId: registrarReinstate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Mint'
        - name: owner
          in: path
          required: true
          description: investor wallet (base58)
          schema:
            type: string
      responses:
        "200":
          description: executed; body carries the transaction signatures
        "400":
          description: mint or owner is not base58
        "401":
          description: no valid back-office session
        "403":
          description: role is not registrar or admin
        "404":
          description: unknown_series
        "409":
          description: the chain refused the step (onchainError)
  /registrar/series/{mint}/trades:
    post:
      summary: Create a secondary trade on the Solana DvP program and admit its bond escrow (trade:create, one transaction)
      operationId: registrarTradeCreate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Mint'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeCreateRequest'
      responses:
        "200":
          description: created and admitted; the trade's SwapDvp address and the transaction signature
          content:
            application/json:
              schema:
                type: object
                required:
                  - signatures
                  - swapDvp
                properties:
                  signatures:
                    type: array
                    items:
                      type: string
                  swapDvp:
                    type: string
        "400":
          description: invalid_body — seller or buyer not base58, seller equals buyer, or units below 1
        "401":
          description: no valid back-office session
        "403":
          description: role is not registrar or admin
        "404":
          description: unknown_series
        "409":
          description: the chain refused the trade (onchainError), e.g. InvalidTrade or a suspended party
  /registrar/series/{mint}/trades/{swapDvp}/settle:
    post:
      summary: Settle an admitted trade — SettleDvp (both legs atomically) + release_trade, one transaction
      operationId: registrarTradeSettle
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Mint'
        - $ref: '#/components/parameters/SwapDvp'
      responses:
        "200":
          description: settled; body carries the transaction signatures
          content:
            application/json:
              schema:
                type: object
                required:
                  - signatures
                properties:
                  signatures:
                    type: array
                    items:
                      type: string
        "401":
          description: no valid back-office session
        "403":
          description: role is not registrar or admin
        "404":
          description: unknown_series or trade_not_found
        "409":
          description: the chain refused the settlement (onchainError), e.g. a leg not funded or the trade expired
  /registrar/series/{mint}/trades/{swapDvp}/cancel:
    post:
      summary: Cancel an admitted trade — CancelDvp + release_trade in one transaction; with force, return the escrowed bonds to the seller without the DvP program
      operationId: registrarTradeCancel
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Mint'
        - $ref: '#/components/parameters/SwapDvp'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeCancelRequest'
      responses:
        "200":
          description: cancelled; signatures and the units a forced release moved back to the seller (0 otherwise)
          content:
            application/json:
              schema:
                type: object
                required:
                  - signatures
                  - returnedUnits
                properties:
                  signatures:
                    type: array
                    items:
                      type: string
                  returnedUnits:
                    type: string
                    description: decimal string
        "400":
          description: invalid_body
        "401":
          description: no valid back-office session
        "403":
          description: role is not registrar or admin
        "404":
          description: unknown_series or trade_not_found
        "409":
          description: the chain refused the cancel (onchainError), e.g. a refund account is closed — retry with force
  /registrar/audit:
    get:
      summary: The back-office audit feed (who ran which write, and what it did)
      operationId: registrarAudit
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: audit rows, newest first
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
        "400":
          description: limit out of range
        "401":
          description: no valid back-office session
        "403":
          description: role is not registrar or admin
  /demo/investor/subscribe:
    post:
      summary: Subscribe at par with the demo investor's custodial keypair
        (judges without a wallet); labelled demo custodial wallet in the UI.
      operationId: demoSubscribe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoSubscribeRequest'
      responses:
        "200":
          description: subscribed; tx signature and explorer URL in the body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoResponse'
        "400":
          description: units < 1 or not a base58 mint
        "401":
          description: no valid session
        "403":
          description: role is not investor_demo or admin
        "404":
          description: unknown_series
        "409":
          description: the chain refused the subscribe (onchainError)
  /demo/investor/series/{mint}/trades/{swapDvp}/fund:
    post:
      summary: Fund one leg of an admitted trade with a server-held demo investor keypair (trade:fund); the demo investor and the registrar may call it
      operationId: demoTradeFund
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Mint'
        - $ref: '#/components/parameters/SwapDvp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeFundRequest'
      responses:
        "200":
          description: leg funded; tx signature and explorer URL in the body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoResponse'
        "400":
          description: invalid_body — side is not seller or buyer
        "401":
          description: no valid session
        "403":
          description: role is not investor_demo, registrar or admin; or not_demo_investor when the server holds no keypair for that party
        "404":
          description: unknown_series or trade_not_found
        "409":
          description: the chain refused the transfer (onchainError)
  /demo/investor/vote:
    post:
      summary: Cast a snapshot-weighted vote with the demo investor's keypair
      operationId: demoVote
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoVoteRequest'
      responses:
        "200":
          description: vote cast; body carries the tx signature and explorer URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoResponse'
        "400":
          description: unknown choice or not a base58 action
        "401":
          description: no valid session
        "403":
          description: role is not investor_demo or admin
        "404":
          description: no corporate action at the PDA
        "409":
          description: the chain refused the vote (onchainError)
  /network:
    get:
      summary: Network profile of this instance (devnet/mainnet) and demo-login
        availability
      operationId: getNetwork
      responses:
        "200":
          description: network profile
          content:
            application/json:
              schema:
                type: object
                required:
                  - network
                  - programId
                  - explorerCluster
                  - mainnet
                  - demoLogin
                properties:
                  network:
                    type: string
                    example: devnet
                  programId:
                    type: string
                  explorerCluster:
                    type: string
                    example: devnet
                  mainnet:
                    type: boolean
                  demoLogin:
                    type: boolean
  /assets:
    get:
      summary: Enabled cash assets of this network (verified facts only)
      operationId: listCashAssets
      responses:
        "200":
          description: cash assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CashAsset'
  /me/faucet:
    post:
      summary: Mint test cash (100,000 major units) to the user's first verified
        wallet through the qupon CLI executor; once per user per asset per hour.
        Test networks only — 403 on mainnet.
      operationId: meFaucet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mint
              properties:
                mint:
                  type: string
                  description: test-asset mint (base58)
      responses:
        "200":
          description: minted; signature and explorer URL in the body
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - symbol
                  - amount
                  - signature
                properties:
                  ok:
                    type: boolean
                  symbol:
                    type: string
                    example: tKZT
                  amount:
                    type: integer
                    description: minor units minted
                  signature:
                    type: string
                  ata:
                    type: string
                  explorerUrl:
                    type: string
        "400":
          description: not a base58 mint, no linked wallet, or kind not
            faucet-mintable
        "403":
          description: mainnet
        "404":
          description: mint is not a test asset of this network
        "429":
          description: rate_limited — one request per asset per hour
        "409":
          description: the faucet mint failed on-chain
        "503":
          description: executor not configured
  /me/wallets:
    get:
      summary: The signed-in user's linked wallets
      operationId: listWallets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: wallets
          content:
            application/json:
              schema:
                type: object
                required:
                  - wallets
                properties:
                  wallets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Wallet'
    post:
      summary: Link a wallet by a signed challenge message (ed25519, base58
        signature). Demo accounts cannot link wallets.
      operationId: linkWallet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
                - signature
              properties:
                address:
                  type: string
                signature:
                  type: string
                  description: base58 ed25519 signature over the challenge
                    message
                label:
                  type: string
                  description: at most 40 characters
      responses:
        "201":
          description: linked
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet:
                    $ref: '#/components/schemas/Wallet'
        "400":
          description: invalid address/label, no live challenge, or bad
            signature
        "403":
          description: demo_account
        "409":
          description: wallet linked to another account
  /me/wallets/challenge:
    post:
      summary: Request a nonce challenge message to sign for wallet linking
        (10-minute TTL)
      operationId: walletChallenge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
              properties:
                address:
                  type: string
      responses:
        "200":
          description: message to sign
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - expiresAt
                properties:
                  message:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        "400":
          description: address is not a base58 public key
        "403":
          description: demo_account
  /me/wallets/{address}:
    delete:
      summary: Unlink a wallet
      operationId: unlinkWallet
      security:
        - bearerAuth: []
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: unlinked
        "404":
          description: no such wallet on the account
  /me/kyc:
    get:
      summary: The signed-in investor's latest KYC application with its
        documents
      operationId: getMyKyc
      security:
        - bearerAuth: []
      responses:
        "200":
          description: application or null when none
          content:
            application/json:
              schema:
                type: object
                properties:
                  application:
                    type:
                      - object
                      - "null"
                    $ref: '#/components/schemas/KycApplication'
    post:
      summary: Submit a KYC application (review by a registrar is SIMULATED — no
        KYC vendor). Requires a linked wallet and at least one uploaded identity
        document. Only self-registered investors apply.
      operationId: submitKyc
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - wallet
                - investorType
                - residency
                - taxBps
                - fullName
                - documentIds
                - seriesMints
              properties:
                wallet:
                  type: string
                investorType:
                  type: string
                  enum:
                    - individual
                    - legal_entity
                residency:
                  type: string
                  enum:
                    - resident
                    - nonresident
                taxBps:
                  type: integer
                  minimum: 0
                  maximum: 10000
                fullName:
                  type: string
                  description: 2-120 characters
                documentIds:
                  type: array
                  items:
                    type: integer
                  description: 1-10 own uploads, at least one id_document
                seriesMints:
                  type: array
                  items:
                    type: string
                  description: 1-10 series to join on approval
      responses:
        "201":
          description: submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  application:
                    $ref: '#/components/schemas/KycApplication'
        "400":
          description: invalid_params or wallet_not_linked
        "403":
          description: only self-registered investors apply
        "409":
          description: kyc_pending — an application is already under review
  /me/onboarding:
    get:
      summary: Investor onboarding checklist (wallet, KYC, test cash,
        subscription) and faucet-eligible assets
      operationId: getOnboarding
      security:
        - bearerAuth: []
      responses:
        "200":
          description: checklist and faucet assets
          content:
            application/json:
              schema:
                type: object
                required:
                  - checklist
                  - faucetAssets
                properties:
                  checklist:
                    type: object
                    required:
                      - account
                      - walletLinked
                      - kycApproved
                      - testCashReceived
                      - subscribed
                    properties:
                      account:
                        type: boolean
                      walletLinked:
                        type: boolean
                      kycApproved:
                        type: boolean
                      testCashReceived:
                        type: boolean
                      subscribed:
                        type: boolean
                  faucetAssets:
                    type: array
                    items:
                      type: object
                      properties:
                        mint:
                          type: string
                        symbol:
                          type: string
                        name:
                          type: string
                        decimals:
                          type: integer
                        kind:
                          type: string
  /me/documents:
    get:
      summary: The signed-in user's uploaded documents (metadata only)
      operationId: listMyDocuments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: documents
          content:
            application/json:
              schema:
                type: object
                required:
                  - documents
                properties:
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Document'
    post:
      summary: Upload a document (multipart, PDF/PNG/JPEG by magic bytes, at
        most 10 MB)
      operationId: uploadDocument
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - kind
                - file
              properties:
                kind:
                  type: string
                  enum:
                    - id_document
                    - proof_of_address
                    - prospectus
                    - decision
                    - other
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: '#/components/schemas/Document'
        "400":
          description: invalid kind/missing file/unsupported type
        "403":
          description: demo accounts cannot upload personal documents
        "413":
          description: too_large
        "503":
          description: documents_unavailable (DATA_DIR unset)
  /me/notifications:
    get:
      summary: The signed-in user's in-app notifications
      operationId: listNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: unread
          in: query
          schema:
            type: string
            enum:
              - "1"
            description: 1 = unread only
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: notifications, newest first
          content:
            application/json:
              schema:
                type: object
                required:
                  - notifications
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
  /me/notifications/count:
    get:
      summary: Unread notification count
      operationId: unreadNotifications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: count
          content:
            application/json:
              schema:
                type: object
                required:
                  - unread
                properties:
                  unread:
                    type: integer
  /me/notifications/read:
    post:
      summary: Mark notifications read (specific ids or all)
      operationId: markNotificationsRead
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                all:
                  type: boolean
      responses:
        "200":
          description: marked
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - marked
                properties:
                  ok:
                    type: boolean
                  marked:
                    type: integer
        "400":
          description: 'pass ids or all: true'
  /me/profile:
    patch:
      summary: Update the signed-in user's name and/or locale
      operationId: patchProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 1-80 characters
                locale:
                  type: string
                  enum:
                    - en
                    - ru
                    - kk
      responses:
        "200":
          description: updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        "400":
          description: invalid_params
        "403":
          description: demo_account
  /me/password:
    post:
      summary: Change the password; other sessions are signed out
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current
                - new
              properties:
                current:
                  type: string
                new:
                  type: string
                  description: at least 10 characters, different from the
                    current one
      responses:
        "200":
          description: changed
        "400":
          description: wrong current password or weak new password
        "403":
          description: demo_account
  /me/reports/statement:
    get:
      summary: The signed-in investor's payout statement (JSON, or CSV with
        format=csv)
      operationId: statementReport
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: format
          in: query
          schema:
            type: string
            enum:
              - csv
      responses:
        "200":
          description: payout rows and totals (or a CSV attachment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportEnvelope'
            text/csv:
              schema:
                type: string
        "400":
          description: invalid from/to
        "502":
          description: chain_unavailable
        "503":
          description: no chain reader configured
  /me/reports/tax:
    get:
      summary: The signed-in investor's tax-year payout report (JSON, or CSV
        with format=csv)
      operationId: taxReport
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 2020
            maximum: 2100
        - name: format
          in: query
          schema:
            type: string
            enum:
              - csv
      responses:
        "200":
          description: payouts of the calendar year and totals
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - type: object
                    required:
                      - year
                    properties:
                      year:
                        type: integer
                  - $ref: '#/components/schemas/ReportEnvelope'
            text/csv:
              schema:
                type: string
        "400":
          description: year must be a calendar year
        "502":
          description: chain_unavailable
        "503":
          description: no chain reader configured
  /org:
    get:
      summary: The signed-in user's organisation
      operationId: getOrg
      security:
        - bearerAuth: []
      responses:
        "200":
          description: organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization:
                    $ref: '#/components/schemas/Organization'
        "404":
          description: no_org
    patch:
      summary: Update the organisation profile (name, BIN, website)
      operationId: patchOrg
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 2-120 characters
                bin:
                  type: string
                  description: at most 12 characters
                website:
                  type: string
                  description: at most 200 characters
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization:
                    $ref: '#/components/schemas/Organization'
        "400":
          description: invalid_params
        "403":
          description: demo_account
        "404":
          description: no_org
  /org/members:
    get:
      summary: Members of the signed-in user's organisation
      operationId: listOrgMembers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: members
          content:
            application/json:
              schema:
                type: object
                required:
                  - members
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        "404":
          description: no_org
  /org/invites:
    post:
      summary: Invite an issuer to the organisation (one-time link, 7 days)
      operationId: createInvite
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - role
              properties:
                email:
                  type: string
                role:
                  type: string
                  enum:
                    - issuer
      responses:
        "201":
          description: invite created
          content:
            application/json:
              schema:
                type: object
                required:
                  - url
                  - expiresAt
                properties:
                  url:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        "400":
          description: invalid email or role
        "403":
          description: demo_account
        "404":
          description: no_org
  /org/members/{id}:
    delete:
      summary: Remove a member from the organisation (not yourself, not demo
        identities)
      operationId: removeOrgMember
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: removed
        "400":
          description: self_removal or demo identity
        "404":
          description: no such member
  /auth/signup:
    post:
      summary: Investor self sign-up (open on every network); signs the user in
        on success
      operationId: authSignup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - name
                - password
              properties:
                email:
                  type: string
                name:
                  type: string
                  description: 1-100 characters
                password:
                  type: string
                  description: at least 10 characters, deny-listed ones rejected
                locale:
                  type: string
                  enum:
                    - en
                    - ru
                    - kk
                  default: en
      responses:
        "200":
          description: session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        "400":
          description: invalid_params or weak_password
        "409":
          description: email_taken
        "429":
          description: rate_limited (shared per-IP sign-in limiter)
  /auth/reset:
    post:
      summary: Consume a one-time reset token and set a new password (revokes
        sessions)
      operationId: authReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  description: at least 10 characters
      responses:
        "204":
          description: password reset
        "400":
          description: invalid_params or invalid_token
  /auth/invite/accept:
    post:
      summary: Consume a one-time invite token and create the account in the
        organisation
      operationId: acceptInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - name
                - password
              properties:
                token:
                  type: string
                name:
                  type: string
                password:
                  type: string
                  description: at least 10 characters
      responses:
        "200":
          description: account created and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        "400":
          description: invalid_params or invalid_token
        "409":
          description: email_taken
        "429":
          description: rate_limited
  /documents/{id}:
    get:
      summary: Download a document; series-attached documents are public,
        personal ones need the owner/org/registrar
      operationId: getDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: file bytes (PDF, PNG or JPEG)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: missing or not readable (indistinguishable)
  /series/{mint}/documents:
    get:
      summary: Public documents attached to a series (metadata only)
      operationId: listSeriesDocuments
      parameters:
        - $ref: '#/components/parameters/Mint'
      responses:
        "200":
          description: documents
          content:
            application/json:
              schema:
                type: object
                required:
                  - documents
                properties:
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Document'
  /issuer/series/{mint}/documents:
    post:
      summary: Attach or upload a public series document (prospectus, decision,
        other). Accepts multipart/form-data (direct upload) or JSON {documentId,
        kind}. The issuer must own the series (organisation check).
      operationId: issuerSeriesDocument
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Mint'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - documentId
                - kind
              properties:
                documentId:
                  type: integer
                kind:
                  type: string
                  enum:
                    - prospectus
                    - decision
                    - other
          multipart/form-data:
            schema:
              type: object
              required:
                - kind
                - file
              properties:
                kind:
                  type: string
                  enum:
                    - prospectus
                    - decision
                    - other
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: attached/uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: '#/components/schemas/Document'
        "400":
          description: invalid_params or not your organisation's upload
        "403":
          description: not_your_series
        "404":
          description: unknown document
  /registrar/kyc:
    get:
      summary: The registrar's KYC review queue
      operationId: listKyc
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - submitted
              - approved
              - rejected
      responses:
        "200":
          description: applications
          content:
            application/json:
              schema:
                type: object
                required:
                  - applications
                properties:
                  applications:
                    type: array
                    items:
                      $ref: '#/components/schemas/KycApplication'
        "400":
          description: unknown status
        "403":
          description: role is not registrar or admin
  /registrar/kyc/{id}:
    get:
      summary: One KYC application with its documents' metadata
      operationId: getKyc
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: application
          content:
            application/json:
              schema:
                type: object
                properties:
                  application:
                    $ref: '#/components/schemas/KycApplication'
        "404":
          description: no such application
  /registrar/kyc/{id}/approve:
    post:
      summary: 'Approve a KYC application: attest the wallet (SIMULATED SAS
        attestation) and register the investor in every requested series. A
        series failure keeps the application under review with per-series
        results for retry.'
      operationId: approveKyc
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ok true (approved) or ok false (some series failed,
            status stays submitted) with per-series results
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - status
                  - results
                properties:
                  ok:
                    type: boolean
                  status:
                    type: string
                    enum:
                      - approved
                      - submitted
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        series:
                          type: string
                        investor:
                          type: string
                        signatures:
                          type: array
                          items:
                            type: string
                        error:
                          type: string
                  signatures:
                    type: array
                    items:
                      type: string
        "403":
          description: role is not registrar or admin
        "404":
          description: no such application
        "409":
          description: kyc_decided — already decided
        "503":
          description: executor not configured
  /registrar/kyc/{id}/reject:
    post:
      summary: Reject a KYC application with a reason (1-500 characters)
      operationId: rejectKyc
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: rejected
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - status
                properties:
                  ok:
                    type: boolean
                  status:
                    type: string
                    enum:
                      - rejected
        "400":
          description: reason must be 1-500 characters
        "404":
          description: no such application
        "409":
          description: kyc_decided
  /registrar/reports/holders/{mint}:
