  /actions/{pda}/disclosure.zip:
    get:
      summary: 'Disclosure package ZIP: notices EN/RU/KK, seev.031 (the anchored
        deterministic document), one seev.036 per holder and a manifest.json
        (simulated: true — devnet artefact)'
      operationId: disclosureZip
      parameters:
        - $ref: '#/components/parameters/Pda'
      responses:
        "200":
          description: ZIP archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          description: action not found or no entitlements snapshotted
        "409":
