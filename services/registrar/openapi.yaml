                      properties:
                        id:
                          type: integer
                        ts:
                          type: integer
                        email:
                          type: string
                        role:
                          type: string
                        route:
                          type: string
                        ok:
                          type: boolean
                        detail:
                          type: string
            text/csv:
              schema:
                type: string
        "403":
          description: role is not admin
  /admin/assets:
    get:
      summary: All cash assets of this network including disabled ones (admin)
      operationId: adminListAssets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CashAsset'
        "403":
          description: role is not admin
    post:
      summary: 'Add a cash asset by mint address (admin): verified on-chain and
        stored disabled — an admin must confirm metadata and enable it
        separately.'
      operationId: adminAddAsset
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mint
              properties:
                mint:
                  type: string
      responses:
        "201":
          description: stored disabled; warnings list what to double-check
          content:
            application/json:
              schema:
                type: object
                required:
                  - asset
                  - warnings
                properties:
                  asset:
                    $ref: '#/components/schemas/CashAsset'
                  warnings:
                    type: array
                    items:
                      type: string
                      enum:
                        - freeze_authority
                        - mint_authority
                        - symbol_collision
        "400":
          description: not_a_mint or unknown_token_program
        "403":
          description: role is not admin
        "409":
          description: asset_exists
        "502":
          description: chain read failed
        "503":
          description: chain reader not configured
  /admin/assets/{mint}:
    patch:
      summary: Update an asset's metadata and/or enable it (admin)
      operationId: adminPatchAsset
      security:
        - bearerAuth: []
      parameters:
        - name: mint
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                  description: 1-12 characters
                name:
                  type: string
                  description: 1-60 characters
                kind:
                  type: string
                  enum:
                    - test
                    - stablecoin
                    - wrapped_cbdc
                    - spl
                issuerNote:
                  type: string
                enabled:
                  type: boolean
                acceptFreezeAuthority:
                  type: boolean
                  description: required to enable a mint whose freeze authority
                    is set
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - asset
                  - warnings
                properties:
                  asset:
                    $ref: '#/components/schemas/CashAsset'
                  warnings:
                    type: array
                    items:
                      type: string
        "400":
          description: invalid_params or freeze_authority_unconfirmed
        "403":
          description: role is not admin
        "404":
          description: no asset with that mint
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: back-office session token from /auth/login or /auth/demo
  parameters:
    Mint:
      name: mint
      in: path
      required: true
      description: Bond mint pubkey (base58)
      schema:
        type: string
    SwapDvp:
      name: swapDvp
      in: path
      required: true
      description: The trade's SwapDvp record on the Solana DvP program (base58)
      schema:
        type: string
    Pda:
      name: pda
      in: path
      required: true
      description: Account pubkey (base58) — CorporateAction or Entitlement PDA
      schema:
        type: string
  schemas:
    User:
      type: object
      required:
        - id
        - email
        - name
        - role
        - isDemo
      properties:
        id:
