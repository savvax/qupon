          type: string
        label:
          type: string
          example: Altyn Capital
        units:
          type: string
          description: bonds held now, decimal string
        route:
          type: string
          enum: [wallet, bank]
          description: bank pays the paying agent (SIMULATED bank transfer)
        taxRateBps:
          type: integer
        kind:
          type: string
          enum: [demo, wallet]
    TradeAccrued:
      description: the program's TradeAccrued event — clean + accrued = the
        cash leg (accrued is negative in the ex-coupon window).
        in the ex-coupon window).
      type: object
      required:
        - units
        - seller
        - buyer
        - clean
        - accrued
        - cash
        - accruedDays
        - settleDate
      properties:
        units:
          type: string
        seller:
          type: string
        buyer:
          type: string
        clean:
          $ref: '#/components/schemas/Amount'
        accrued:
          $ref: '#/components/schemas/Amount'
        cash:
          $ref: '#/components/schemas/Amount'
        accruedDays:
          type: integer
        settleDate:
          type: string
          description: civil settlement date on the bond's calendar, YYYY-MM-DD
    SandboxScenario:
      description: one judge scenario's result, replayed in Sandbox.scenarios
        (newest first).
      type: object
      required: [kind, at, signatures]
      properties:
        kind:
          type: string
          enum: [skip_funding, cure, non_kyc_transfer, dvp_trade]
        at:
          type: integer
          description: unix ms
        signatures:
          type: array
          items:
            type: string
          description: devnet txs it produced; a refusal's failed tx too
            (skipPreflight)
        error:
          type: string
          description: program error name of a refusal (non_kyc_transfer)
        logs:
          type: array
          items:
            type: string
        trade:
          $ref: '#/components/schemas/TradeAccrued'
    SandboxNext:
      description: what the autopilot pushes next; null step when the bond's
        life is over.
      type: object
      required: [step, actor, at]
      properties:
        step:
          type:
            - string
            - "null"
          description: announce, strike, snapshot, finalize, fund, pay,
            complete, close, declare_default, confirm_bank or null
            declare_default, confirm_bank or null
        actor:
          type:
            - string
            - "null"
          enum: [registrar, anyone, issuer, payingAgent, null]
        at:
          type:
            - integer
            - "null"
          description: unix ms when it becomes possible; null = now
    SandboxActivity:
      type: object
      required: [id, ts, kind, sig, slot, payload]
      properties:
        id:
          type: integer
        ts:
          type: integer
        kind:
          type: string
        sig:
          type: string
        slot:
          type: integer
        actionPda:
          type:
            - string
            - "null"
        payload:
          type: object
        explorerUrl:
          type:
            - string
            - "null"
    Sandbox:
      description: GET /demo/sandbox/{id} — the sandbox page's poll.
      type: object
      required:
        - id
        - clock
        - serverTime
        - expiresAt
        - wallet
        - autofund
        - series
        - schedule
        - actions
        - holders
        - entitlements
        - next
        - activity
        - scenarios
        - links
      properties:
        id:
          type: string
        clock:
          $ref: '#/components/schemas/SandboxClock'
        serverTime:
          type: integer
          description: unix ms when the response was built
        expiresAt:
          type: integer
          description: unix ms; after it GET answers 404
        wallet:
          type:
            - string
            - "null"
        autofund:
          type: boolean
          description: false after skip_funding until a cure
        series:
          allOf:
            - $ref: '#/components/schemas/SeriesDTO'
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleItem'
        actions:
          type: array
          description: every action of the series, oldest first
          items:
            $ref: '#/components/schemas/ActionDTO'
        holders:
          type: array
          items:
            $ref: '#/components/schemas/SandboxHolder'
        entitlements:
          type: array
          description: of the open action, else the latest one; status may be
            PaidToAgent
          items:
            $ref: '#/components/schemas/EntitlementDTO'
        next:
          $ref: '#/components/schemas/SandboxNext'
        activity:
          type: array
          description: the series' indexed events, newest first
          items:
            $ref: '#/components/schemas/SandboxActivity'
        scenarios:
          type: array
          description: scenarios run so far, newest first
          items:
            $ref: '#/components/schemas/SandboxScenario'
        links:
          $ref: '#/components/schemas/SandboxLinks'
