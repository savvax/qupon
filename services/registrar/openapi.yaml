            application/json:
              schema:
                type: object
                required:
                  - ticker
                  - stale
                properties:
                  ticker:
                    type: string
                  stale:
                    type: boolean
                    description: true when the cached copy is past its freshness
                      TTL
                  fetchedAt:
                    type: string
                    format: date-time
                  schedule:
                    type: array
                    items:
                      type: object
                      properties:
                        start:
                          type: string
                          format: date
                        end:
                          type: string
                          format: date
                        recordDate:
                          type: string
                          format: date
                        rate:
                          type: string
        "400":
          description: invalid_ticker
        "404":
          description: kase_not_found
        "502":
          description: kase_unavailable
        "503":
          description: kase client not configured
  /kase/news/{issuer}:
    get:
