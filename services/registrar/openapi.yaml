  /admin/audit:
    get:
      summary: The admin audit feed with filters (JSON, or CSV with format=csv)
      operationId: adminAudit
      security:
        - bearerAuth: []
      parameters:
        - name: user
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
        - name: route
          in: query
          schema:
            type: string
        - name: ok
          in: query
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: format
          in: query
          schema:
            type: string
