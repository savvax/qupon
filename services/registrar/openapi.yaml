          type: string
          description: devnet explorer link for the entitlement PDA
    HolderKycDTO:
      description: KYC state of a registration (the SAS attestation is
        SIMULATED by the vendor stub).
      type: object
      required: [attested, ref]
      properties:
        attested:
          type: boolean
        ref:
          type: string
          description: attestation PDA (base58); empty when registered before
            KYC was enforced
    PayoutRouteDTO:
      description: Where this holder asked payouts to go (plan 15 D6); set
        only by the holder's signature.
      type: object
      required: [route]
      properties:
        route:
          type: string
          enum: [wallet, bank]
        bankRefHash:
          type:
            - string
            - "null"
          description: hex sha256 of the bank details (bank route only)
        updatedAt:
          type:
            - string
            - "null"
          format: date-time
    HolderPositionDTO:
      description: One series the wallet is registered in.
      type: object
      required:
        - series
        - mint
        - ticker
        - isin
        - bondAta
        - cashAta
        - units
        - status
        - kyc
        - explorerUrl
      properties:
        series:
          type: string
          description: Series PDA
        mint:
          type: string
        ticker:
          type: string
        isin:
          type: string
        bondAta:
          type: string
        cashAta:
          type: string
        units:
          type: string
          description: live bond balance, decimal string
        status:
          type: string
          enum: [Active, Suspended]
        kyc:
          $ref: '#/components/schemas/HolderKycDTO'
        payoutRoute:
          oneOf:
            - $ref: '#/components/schemas/PayoutRouteDTO'
            - type: "null"
          description: null when the holder never set one — payouts go to the
            registered cash account
        explorerUrl:
          type: string
    HolderEntitlementDTO:
      description: One entitlement with the action kind and the paying tx.
      allOf:
        - $ref: '#/components/schemas/EntitlementDTO'
        - type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [INTR, REDM, MCAL, PCAL, BMET, CHAN]
            paidTx:
              type:
                - string
                - "null"
              description: tx signature that moved this payout
                (EntitlementPaid or PaidToAgent), when the feed holds it
            paidTxUrl:
              type:
                - string
                - "null"
              description: devnet explorer link for paidTx
    UpcomingPayoutDTO:
      description: Next payout of a series — the open action when one runs,
        else the projected next coupon through the series clock.
      type: object
      required: [mint, ticker, kind, recordAt, paymentAt]
      properties:
        mint:
          type: string
        ticker:
          type: string
        kind:
          type: string
          description: action kind, or "INTR (projected)" when unannounced
        actionPda:
          type:
            - string
            - "null"
        recordAt:
          type: string
          format: date-time
        paymentAt:
          type: string
          format: date-time
    HolderLookupDTO:
      description: The public holder lookup answer for one wallet.
      type: object
      required: [owner, positions, entitlements, upcomingPayouts]
      properties:
        owner:
          type: string
        positions:
          type: array
          items:
            $ref: '#/components/schemas/HolderPositionDTO'
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/HolderEntitlementDTO'
        upcomingPayouts:
          type: array
          items:
            $ref: '#/components/schemas/UpcomingPayoutDTO'
    ScheduleItem:
      description: One projected coupon (or redemption) on the series schedule.
      type: object
      required:
        - couponNumber
        - recordDate
        - paymentDate
        - status
      properties:
        couponNumber:
          type: integer
          example: 2
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        recordDate:
          type: string
          format: date-time
          description: ISO 8601 with +05:00
        paymentDate:
          type: string
          format: date-time
        amountPerUnit:
          $ref: '#/components/schemas/Amount'
        totalAmount:
          $ref: '#/components/schemas/Amount'
        actionPda:
          type:
            - string
            - "null"
          description: set once announced
        status:
          type: string
          enum:
            - Projected
            - Announced
            - InProgress
            - Completed
    Approval:
      description: One scheduler proposal awaiting a human decision (task 024).
      type: object
      required:
        - id
        - ts
        - dedupKey
        - seriesMint
        - step
        - args
        - status
      properties:
        id:
          type: integer
        ts:
          type: integer
          description: unix seconds
        dedupKey:
          type: string
        seriesMint:
          type: string
        actionPda:
          type: string
          description: empty for announce decisions
        step:
          type: string
          example: step:strike_record
        args:
          type: array
          items:
            type: string
          description: the exact qupon CLI argv approve runs
        status:
          type: string
          enum:
            - pending
            - running
            - executed
            - rejected
            - stale
        detail:
          type:
            - object
            - "null"
          description: CLI result JSON once executed
    ReconcileReport:
      description: 'Registrar recomputation vs chain: entitlements recomputed
        from bond ATA balances (minContextSlot = snapshot_slot), snapshot hash
        chained sha256(prev ‖ owner ‖ units_le) over investors owner-ascending,
        and action totals (docs/03-domain.md §4).'
      type: object
      required:
        - actionPda
        - ok
        - holders
        - mismatches
        - expectedHash
        - onchainHash
        - hashMatches
        - supply
        - unitsSnapshotted
        - totalsMatch
      properties:
        actionPda:
          type: string
        actionStatus:
          type: string
          example: Completed
        ok:
          type: boolean
        holders:
          type: integer
          description: investors with a non-zero balance at read time
        mismatches:
          type: array
          items:
            type: object
            required:
              - owner
              - reason
            properties:
              owner:
                type: string
              reason:
                type: string
                enum:
                  - missing_entitlement
                  - unexpected_entitlement
                  - entitlement_mismatch
                  - ata_mismatch
              fields:
                type: array
                items:
                  type: string
                description: differing fields among
                  units/gross/tax/net/principal
              expected:
                $ref: '#/components/schemas/ReconcileEntry'
              onchain:
                $ref: '#/components/schemas/ReconcileEntry'
        expectedHash:
          type: string
          description: base58 sha256 chain recomputed owner-ascending
        onchainHash:
          type: string
        hashMatches:
          type: boolean
        hashScheme:
          type: integer
          enum: [0, 1]
          description: 'plan 15 D3 — 0: rolling sha256 chain over owner-sorted
            holders; 1: order-independent set hash (XOR of one hash per holder),
            so parallel or permissionless batches verify the same'
        supply:
          type: integer
          description: bond mint supply at read time
        unitsSnapshotted:
          type: integer
        expectedTotals:
          $ref: '#/components/schemas/ReconcileTotals'
        onchainTotals:
          $ref: '#/components/schemas/ReconcileTotals'
        totalsMatch:
          type: boolean
        checkedAt:
          type: integer
          description: unix seconds
    ReconcileEntry:
      type: object
      required:
        - units
        - gross
        - tax
        - net
        - principal
      properties:
        units:
          type: integer
        gross:
          type: integer
        tax:
          type: integer
        net:
          type: integer
        principal:
          type: integer
    ReconcileTotals:
      type: object
      required:
        - units
        - holders
        - gross
        - tax
        - net
        - principal
      properties:
        units:
          type: integer
        holders:
          type: integer
        gross:
          type: integer
        tax:
          type: integer
        net:
          type: integer
        principal:
          type: integer
    AdvanceRequest:
      type: object
      required:
        - confirm
      properties:
        confirm:
          type: boolean
          description: must be true; refuses without explicit confirmation
        autofund:
          type: boolean
          description: fund the escrow from the paying agent (demo mode) when
            the action waits for funding
          default: false
    AdvanceResponse:
      type: object
      required:
        - step
        - ok
        - status
      properties:
