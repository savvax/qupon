                          type: string
        "400":
          description: invalid issuer code or lang
        "404":
          description: kase_not_found
        "502":
          description: kase_unavailable
        "503":
          description: kase client not configured
  /kase/series/{mint}:
    get:
      summary: The KASE ticker linked to a series (series_settings), 404 when
