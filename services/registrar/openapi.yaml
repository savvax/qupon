          content:
            application/json:
              schema:
                type: object
                required:
                  - series
                properties:
                  series:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminSeries'
        "403":
          description: role is not admin
  /admin/series/{mint}:
    patch:
      summary: Update a series' admin settings (hidden, featured, KASE ticker,
        owning organisation, autopilot scenario)
      operationId: adminPatchSeries
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Mint'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hidden:
                  type: boolean
                featured:
                  type: boolean
                kaseTicker:
                  type: string
                  description: empty clears; 2-12 alphanumeric
                orgId:
                  type: integer
                  description: 0 clears the owning organisation
                noAutofund:
                  type: boolean
                  description: true keeps the autopilot from funding the
                    escrow (default/cure demo)
      responses:
        "200":
          description: updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSeries'
        "400":
          description: invalid ticker or orgId
        "403":
          description: role is not admin
  /admin/showcase/seed:
    post:
      summary: Seed the curated public showcase (plan 15 task 1535) — mark the
        four showcase series featured and hide uncurated demo-clock series
      description: Matches series by ISIN from the Showcase definitions in
        internal/api/showcase.go (the data itself is created on devnet by task
        1540). Judge sandboxes (demo clock, not admin-featured) leave the public
        board; idempotent.
      operationId: adminShowcaseSeed
      security:
        - bearerAuth: []
      responses:
        "200":
          description: seed result
          content:
            application/json:
              schema:
                type: object
                required:
                  - seeded
                  - hidden
                  - missing
                properties:
                  seeded:
                    type: array
                    items:
                      type: string
                    description: mints marked featured, in showcase order
                  hidden:
                    type: array
                    items:
                      type: string
                    description: mints hidden (uncurated demo-clock series)
                  missing:
                    type: array
                    items:
                      type: string
                    description: showcase ISINs with no on-chain series yet
        "403":
          description: role is not admin
  /admin/audit:
    get:
      summary: The admin audit feed with filters (JSON, or CSV with format=csv)
      operationId: adminAudit
      security:
        - bearerAuth: []
      parameters:
        - name: user
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
        - name: route
          in: query
          schema:
            type: string
        - name: ok
          in: query
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: format
          in: query
          schema:
            type: string
            enum:
              - csv
      responses:
        "200":
          description: audit rows, newest first
          content:
            application/json:
              schema:
                type: object
                required:
                  - entries
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - ts
                        - email
                        - role
                        - route
                      properties:
                        id:
                          type: integer
                        ts:
                          type: integer
                        email:
                          type: string
                        role:
                          type: string
                        route:
                          type: string
                        ok:
                          type: boolean
                        detail:
                          type: string
            text/csv:
              schema:
                type: string
        "403":
          description: role is not admin
  /admin/assets:
    get:
      summary: All cash assets of this network including disabled ones (admin)
      operationId: adminListAssets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CashAsset'
        "403":
          description: role is not admin
    post:
      summary: 'Add a cash asset by mint address (admin): verified on-chain and
        stored disabled — an admin must confirm metadata and enable it
        separately.'
      operationId: adminAddAsset
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mint
              properties:
                mint:
                  type: string
      responses:
        "201":
          description: stored disabled; warnings list what to double-check
          content:
            application/json:
              schema:
                type: object
                required:
                  - asset
                  - warnings
                properties:
                  asset:
                    $ref: '#/components/schemas/CashAsset'
                  warnings:
                    type: array
                    items:
                      type: string
                      enum:
                        - freeze_authority
                        - mint_authority
                        - symbol_collision
        "400":
          description: not_a_mint or unknown_token_program
        "403":
          description: role is not admin
        "409":
          description: asset_exists
        "502":
          description: chain read failed
        "503":
          description: chain reader not configured
  /admin/assets/{mint}:
    patch:
      summary: Update an asset's metadata and/or enable it (admin)
      operationId: adminPatchAsset
      security:
        - bearerAuth: []
      parameters:
        - name: mint
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                  description: 1-12 characters
                name:
                  type: string
                  description: 1-60 characters
                kind:
                  type: string
                  enum:
                    - test
                    - stablecoin
                    - wrapped_cbdc
                    - spl
                issuerNote:
                  type: string
                enabled:
                  type: boolean
                acceptFreezeAuthority:
                  type: boolean
                  description: required to enable a mint whose freeze authority
                    is set
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - asset
                  - warnings
                properties:
                  asset:
                    $ref: '#/components/schemas/CashAsset'
                  warnings:
                    type: array
                    items:
                      type: string
        "400":
          description: invalid_params or freeze_authority_unconfirmed
        "403":
          description: role is not admin
        "404":
          description: no asset with that mint
  /demo/sandbox:
    post:
      summary: Create a judge sandbox (task 1524), a bond series of the
        visitor's own on a demo clock
      description: Creates a demo-clock series (1 s per civil day, 1-year
        semi-annual 10 % bond, ticker SBX-<6>), registers the three custodial
        demo investors (10 / 25 / 65 bonds, the pension fund bank-routed at
        15 % tax) plus the optional visitor wallet (SAS attest + register +
        faucet + 5 bonds), attaches the visitor via the qupon_sandbox httpOnly
        cookie (24 h). Idempotent per requestId. Rate limits — 3 per visitor
        per hour, 30 per day — keyed on the LAST X-Forwarded-For entry. Off on
        mainnet.
      tags: [demo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxCreateRequest'
      responses:
        "201":
          description: the sandbox was created (or already existed for this
            requestId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxCreated'
          headers:
            Set-Cookie:
              description: qupon_sandbox=<id>; HttpOnly; Max-Age=86400
              schema:
                type: string
        "400":
          description: bad_wallet or invalid_params
        "429":
          description: demo_throttled
        "502":
          description: executor_failed
        "503":
          description: sandbox_off (no executor / chain reader / mainnet)
  /demo/sandbox/{id}:
    get:
      summary: The sandbox page's poll - the bond's live state on the demo clock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: the sandbox (serverTime lets the client correct its
            clock)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        "404":
          description: sandbox_not_found (unknown or expired after 24 h)
  /demo/sandbox/{id}/scenario:
    post:
      summary: Run a judge scenario against the sandbox
      description: skip_funding flags the next coupon to default (the
        autopilot stops funding; cure undoes it), cure funds a defaulted
        coupon's real shortfall, non_kyc_transfer attempts a bond transfer to
        an unregistered wallet and reports the on-chain refusal (sent with
        skipPreflight, so it has a signature and logs), dvp_trade creates +
        funds + settles a 5-bond trade at clean 100 % + accrued.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kind
              properties:
                kind:
                  type: string
                  enum: [skip_funding, cure, non_kyc_transfer, dvp_trade]
      responses:
        "200":
          description: the scenario result (stored and replayed in
            Sandbox.scenarios)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxScenario'
        "400":
          description: bad_kind
        "404":
          description: sandbox_not_found
        "409":
          description: scenario_unavailable (e.g. cure without a default)
        "502":
          description: executor_failed
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: back-office session token from /auth/login or /auth/demo
  parameters:
    Mint:
      name: mint
      in: path
      required: true
      description: Bond mint pubkey (base58)
      schema:
        type: string
    Owner:
      name: owner
      in: path
      required: true
      description: Holder wallet pubkey (base58)
      schema:
        type: string
    SwapDvp:
      name: swapDvp
      in: path
      required: true
      description: The trade's SwapDvp record on the Solana DvP program (base58)
      schema:
        type: string
    Pda:
      name: pda
      in: path
      required: true
      description: Account pubkey (base58) — CorporateAction or Entitlement PDA
      schema:
        type: string
  schemas:
    User:
      type: object
      required:
        - id
        - email
        - name
        - role
        - isDemo
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
            - issuer
            - registrar
            - investor_demo
            - admin
        isDemo:
          type: boolean
    Session:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    AuditEntry:
      type: object
      required:
        - id
        - ts
        - userId
        - role
        - route
        - params
        - ok
        - detail
        - signatures
      properties:
        id:
          type: integer
        ts:
          type: integer
          description: unix seconds
        userId:
          type: integer
        role:
          type: string
        route:
          type: string
          example: POST /registrar/investors
        params:
          type: object
          description: request params JSON
        ok:
          type: boolean
        detail:
          type: string
        signatures:
          type: array
          items:
            type: string
    DemoSubscribeRequest:
      type: object
      required:
        - series
        - units
      properties:
        series:
          type: string
          description: bond mint (base58)
        units:
          type: integer
          minimum: 1
    DemoVoteRequest:
      type: object
      required:
        - action
        - choice
      properties:
        action:
          type: string
          description: CorporateAction PDA (base58)
        choice:
          type: string
          enum:
            - for
            - against
            - abstain
    DemoClaimRequest:
      type: object
      required:
        - action
        - owner
      properties:
        action:
          type: string
          description: >-
            CorporateAction PDA (base58) of the funded action being claimed
        owner:
          type: string
          description: >-
            the claiming holder (base58); must be one of the server-held demo
            investors
    DemoResponse:
      description: Demo custodial-wallet action result (always demo:true).
      type: object
      required:
        - demo
        - ok
        - signature
      properties:
        demo:
          type: boolean
        ok:
          type: boolean
        signature:
          type: string
        explorerUrl:
          type: string
    Amount:
      description: Money amount in minor units plus a human display string.
      type: object
      required:
        - minor
        - display
        - currency
      properties:
        minor:
          type: string
          description: Integer amount in minor units, decimal string
          example: "1250"
        display:
          type: string
          example: 12.50 KZT
        currency:
          type: string
          example: tKZT
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: machine-readable code (http_404, executor_failed, or the
            Anchor program error name)
          example: EntitlementCalcMismatch
        message:
          type: string
          example: accrual days do not match crate day count
        onchainError:
          description: raw Anchor/program error when the failure came from-chain
          type: string
    Health:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
        db:
          type: string
          example: ok
    SeriesDTO:
      type: object
      required:
        - mint
        - cashMint
        - isin
        - ticker
        - faceValue
        - couponRateBps
        - frequency
        - dayCount
        - issueDate
        - maturityDate
        - nextCouponDate
        - status
        - totalIssued
        - quorumBps
        - approvalBps
        - explorerUrl
      properties:
        pda:
          type: string
          description: Series account (PDA); activity events name their series
            by it
        mint:
          type: string
        cashMint:
          type: string
        registrar:
          type: string
        issuer:
          type: string
        payingAgent:
          type: string
        isin:
          type: string
          example: KZ1234567890
        ticker:
          type: string
          example: tKZBOND
        faceValue:
          $ref: '#/components/schemas/Amount'
        couponRateBps:
          type: integer
          example: 1000
        frequency:
          type: integer
          description: coupons per year
          enum:
            - 1
            - 2
            - 4
            - 12
        dayCount:
          type: string
          enum:
            - THIRTY_360
            - ACT_ACT
            - ACT_365
        issueDate:
          type: string
          format: date
          example: "2026-09-01"
        maturityDate:
          type: string
          format: date
          example: "2027-09-01"
        nextCouponDate:
          type: string
          format: date-time
          description: ISO 8601 with +05:00
          example: "2026-12-01T00:00:00+05:00"
        status:
          type: string
          enum:
            - Active
            - Matured
            - Retiring
            - Closed
        totalIssued:
          type: string
          description: units in circulation, decimal string
        quorumBps:
          type: integer
        approvalBps:
          type: integer
        openAction:
          type:
            - string
            - "null"
        openTrades:
          type: integer
          description: >-
            admitted secondary trades (Solana DvP) not yet released; the record
            date is refused while above 0
        hookGate:
          type: boolean
          description: >-
            plan 15 D1' — the record date is the transfer-hook gate (the
            register never pauses)
        inDefault:
          type: boolean
          description: >-
            plan 15 D4 — an action of this series is in default and not yet
            cured
        defaultsCount:
          type: integer
          description: >-
            defaults ever declared on this series (public credit signal)
        demoClock:
          oneOf:
            - $ref: '#/components/schemas/DemoClockDTO'
            - type: "null"
          description: plan 15 D7 — null on the real Almaty clock
        featured:
          type: boolean
          description: admin-curated by admins (platform v2 §5.2); these
            series always list first
        explorerUrl:
          type: string
          description: devnet explorer link for the mint
    DemoClockDTO:
      description: >-
        DEMO clock (plan 15 D7) - one civil day lasts daySecs seconds from
        issueTs, whose civil date is issueDate.
      type: object
      required: [daySecs, issueTs, issueDate]
      properties:
        daySecs:
          type: integer
        issueTs:
          type: integer
          format: int64
        issueDate:
          type: string
          format: date
    TradeDTO:
      description: >-
        One admitted secondary trade with the funding of both legs (same field
        names as the CLI's trade:list).
      type: object
      required:
        - swapDvp
        - escrow
        - seller
        - buyer
        - units
        - cashAmount
        - admittedAt
        - fundedUnits
        - fundedCash
        - status
      properties:
        swapDvp:
          type: string
          description: the Solana DvP program's trade record (base58)
        escrow:
          type: string
          description: >-
            bond-leg escrow, the SwapDvp's associated token account for the
            bond mint
        seller:
          type: string
        buyer:
          type: string
        units:
          type: string
          description: bonds traded, decimal string
        cashAmount:
          $ref: '#/components/schemas/Amount'
        admittedAt:
          type: string
          description: RFC 3339 in Asia/Almaty, like the other date-time fields
        fundedUnits:
          type:
            - string
            - "null"
          description: >-
            bonds in the escrow, decimal string; null once the DvP program
            closed the escrow
        fundedCash:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: "null"
          description: >-
            cash in the escrow; null once the DvP program closed the escrow
        status:
          type: string
          enum:
            - awaiting_funding
            - ready
            - closed
    TradeCreateRequest:
      type: object
      required:
        - seller
        - buyer
        - units
      properties:
        seller:
          type: string
          description: registered investor delivering the bonds (wallet, base58)
        buyer:
          type: string
          description: registered investor paying the cash (wallet, base58)
        units:
          type: integer
          minimum: 1
          description: bonds to trade, priced at par (face value)
    TradeCancelRequest:
      type: object
      properties:
        force:
          type: boolean
          description: >-
            skip the DvP program and return the escrowed bonds to the seller as
            permanent delegate
    TradeFundRequest:
      type: object
      required:
        - side
      properties:
        side:
          type: string
          enum:
            - seller
            - buyer
    InvestorDTO:
      type: object
      required:
        - owner
        - bondAta
        - cashAta
        - units
        - status
      properties:
        owner:
          type: string
        bondAta:
          type: string
        cashAta:
          type: string
        units:
          type: string
          description: bond units held, decimal string
        investorType:
          type: string
          enum:
            - individual
            - legal_entity
          description: from the on-chain investor record
        residency:
          type: string
          enum:
            - resident
            - nonresident
        taxRateBps:
          type: integer
          description: withholding tax rate, basis points (1000 = 10%)
        kycRef:
          type: string
          description: Solana Attestation Service attestation PDA (base58);
            empty when the record has none
        status:
          type: string
          enum:
            - Active
            - Suspended
        explorerUrl:
          type: string
          description: devnet explorer link for the owner
    ActionDTO:
      type: object
      required:
        - pda
        - seriesMint
        - kind
        - mandatory
        - corpId
        - recordAt
        - paymentAt
        - status
        - perUnitGross
        - perUnitPrincipal
        - cashMint
        - explorerUrl
      properties:
        pda:
          type: string
        seriesMint:
          type: string
        kind:
          type: string
          enum:
            - INTR
            - REDM
            - MCAL
            - PCAL
            - BMET
            - CHAN
          description: ISO 20022 corp action event type
            (INTE/REDM/MCAL/PCAL/METG/CHAN mapped)
        mandatory:
          type: string
          enum:
            - MAND
            - VOLU
            - CHOS
        corpId:
          type: string
          example: QPNb1-INTR-0001
        officialId:
          type:
            - string
            - "null"
          description: COAF id, may be empty
        announcedAt:
          type: string
          format: date-time
          description: ISO 8601 with +05:00
        recordAt:
          type: string
          format: date-time
        paymentAt:
          type: string
          format: date-time
        periodStart:
          type:
            - string
            - "null"
          format: date
        periodEnd:
          type:
            - string
            - "null"
          format: date
        accrualDays:
          type:
            - integer
            - "null"
        rateBps:
          type:
            - integer
            - "null"
        perUnitGross:
          $ref: '#/components/schemas/Amount'
        perUnitPrincipal:
          $ref: '#/components/schemas/Amount'
        cashMint:
          type: string
        escrow:
          type: string
        escrowBalance:
          $ref: '#/components/schemas/Amount'
          description: live escrow token balance (0 before funding)
        status:
          type: string
          enum:
            - Announced
            - RecordStruck
            - SnapshotComplete
            - Funded
            - Settling
            - Completed
            - Retiring
            - Cancelled
            - VotingOpen
            - Finalized
            - Defaulted
        snapshotSlot:
          type:
            - integer
            - "null"
        snapshotHash:
          type:
            - string
            - "null"
          description: hex sha256
        unitsSnapshotted:
          type:
            - string
            - "null"
        holdersSnapshotted:
          type:
            - integer
            - "null"
        holdersPaid:
          type:
            - integer
            - "null"
        totalGross:
          $ref: '#/components/schemas/Amount'
        totalTax:
          $ref: '#/components/schemas/Amount'
        totalNet:
          $ref: '#/components/schemas/Amount'
        totalPaid:
          $ref: '#/components/schemas/Amount'
        totalRetired:
          type:
            - string
            - "null"
        holdersRetired:
          type:
            - integer
            - "null"
        proposalNewRateBps:
          type:
            - integer
            - "null"
        proposalNewMaturity:
          type:
            - string
            - "null"
          format: date
        votingEndsAt:
          type:
            - string
            - "null"
          format: date-time
        votesFor:
          type:
            - string
            - "null"
        votesAgainst:
          type:
            - string
            - "null"
        votesAbstain:
          type:
            - string
            - "null"
        result:
          type:
            - string
            - "null"
          enum:
            - Pending
            - Approved
            - Rejected
            - NoQuorum
        completedAt:
          type:
            - string
            - "null"
          format: date-time
        factorBps:
          type:
            - integer
            - "null"
        defaultedAt:
          type: ["string", "null"]
          format: date-time
          description: plan 15 D4 — when declare_default ran
        curedAt:
          type: ["string", "null"]
          format: date-time
          description: plan 15 D4 — when late funding cured the default
        bankPending:
          type: integer
          description: >-
            plan 15 D6 — bank-routed payouts awaiting the paying agent's
            confirmation (complete needs 0)
        disclosureHash:
          type: ["string", "null"]
          description: >-
            plan 15 D9 — hex sha256 of the official notice (seev.031), anchored
            once
        finalizedAt:
          type: ["string", "null"]
          format: date-time
          description: >-
            when the snapshot was finalized; a default is due one series day
            after max(paymentAt, finalizedAt)
        explorerUrl:
          type: string
          description: devnet explorer link for the action PDA
    EntitlementDTO:
      type: object
      required:
        - pda
        - actionPda
        - owner
        - units
        - status
      properties:
        pda:
          type: string
        actionPda:
          type: string
        owner:
          type: string
        units:
          type: string
        gross:
          $ref: '#/components/schemas/Amount'
        tax:
          $ref: '#/components/schemas/Amount'
        net:
          $ref: '#/components/schemas/Amount'
        principal:
          $ref: '#/components/schemas/Amount'
        status:
          type: string
          enum:
            - Snapshotted
            - Paid
            - Retired
            - PaidToAgent
        paidAt:
          type:
            - string
            - "null"
          format: date-time
        vote:
          type: string
          enum:
            - None
            - For
            - Against
            - Abstain
        votedAt:
          type:
            - string
            - "null"
          format: date-time
