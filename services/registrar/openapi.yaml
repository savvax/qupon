      operationId: disclosureSubmit
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Pda'
      responses:
        "200":
          description: recorded
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - simulated
                properties:
                  ok:
                    type: boolean
                  simulated:
                    type: boolean
                    example: true
        "403":
          description: role is not registrar or admin
        "404":
          description: action_not_found
        "503":
          description: chain reader not configured
  /admin/system:
